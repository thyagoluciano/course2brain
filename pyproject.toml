[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course2brain"
version = "0.1.0"
description = "Transform online courses into an interlinked Obsidian Second Brain knowledge graph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Thyago Luciano", email = "thyagoluciano@users.noreply.github.com" }
]
keywords = ["obsidian", "second-brain", "pkm", "learning", "knowledge-graph", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "google-genai>=1.0.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
c2b = "c2b.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/c2b"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
