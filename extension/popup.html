<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>course2brain</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --success: #10b981;
      --error: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .badge-online .dot { background: var(--success); }
    .badge-offline .dot { background: var(--error); }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 14px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .meta-row:last-child {
      margin-bottom: 0;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-val {
      font-weight: 500;
      max-width: 190px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-action {
      width: 100%;
      padding: 10px 14px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-action:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn-action:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .status-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1.4;
      display: none;
    }

    .status-box.info {
      display: block;
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
    }

    .status-box.success {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-box.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🧠</span>
      <span>course2brain</span>
    </div>
    <div id="serverStatus" class="badge badge-offline">
      <span class="dot"></span>
      <span id="serverStatusText">Verificando...</span>
    </div>
  </header>

  <div class="card">
    <div class="meta-row">
      <span class="meta-label">Plataforma:</span>
      <span id="platformName" class="meta-val">Detectando...</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Página:</span>
      <span id="pageTitle" class="meta-val">Carregando...</span>
    </div>
  </div>

  <button id="btnProcess" class="btn-action" disabled>
    <span id="btnIcon">⚡</span>
    <span id="btnText">Sintetizar & Salvar no Brain</span>
  </button>

  <div id="statusBox" class="status-box"></div>

  <script src="popup.js"></script>
</body>
</html>
