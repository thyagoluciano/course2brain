<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>course2brain</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #1e293b;
      --card-border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-glow: rgba(99, 102, 241, 0.25);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --error: #ef4444;
      --error-bg: rgba(239, 68, 68, 0.12);
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      font-size: 13px;
      line-height: 1.4;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: -0.02em;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge-online {
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-offline {
      background: rgba(239, 68, 68, 0.15);
      color: var(--error);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .badge-online .dot { background: var(--success); }
    .badge-offline .dot { background: var(--error); }

    .card {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 12px;
    }

    .meta-row:last-child {
      margin-bottom: 0;
    }

    .meta-label {
      color: var(--text-muted);
    }

    .meta-val {
      font-weight: 500;
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-action {
      width: 100%;
      padding: 11px 14px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px var(--accent-glow);
    }

    .btn-action:hover:not(:disabled) {
      background: var(--accent-hover);
      box-shadow: 0 4px 12px var(--accent-glow);
      transform: translateY(-1px);
    }

    .btn-action:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Stepper & Visual Progress */
    .progress-card {
      display: none;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      animation: fadeIn 0.25s ease-out;
    }

    .progress-bar-bg {
      width: 100%;
      height: 5px;
      background: #334155;
      border-radius: 9999px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      border-radius: 9999px;
      transition: width 0.4s ease;
    }

    .step-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: opacity 0.2s ease;
    }

    .step-item.pending {
      opacity: 0.4;
    }

    .step-item.active {
      opacity: 1;
    }

    .step-item.done {
      opacity: 1;
    }

    .step-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
      background: #334155;
      color: #94a3b8;
      transition: all 0.2s ease;
      margin-top: 1px;
    }

    .step-item.active .step-icon {
      background: var(--accent);
      color: #ffffff;
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .step-item.done .step-icon {
      background: var(--success);
      color: #ffffff;
    }

    .step-item.error .step-icon {
      background: var(--error);
      color: #ffffff;
    }

    .step-content {
      flex: 1;
    }

    .step-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
    }

    .step-item.pending .step-title {
      color: var(--text-muted);
    }

    .step-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .step-item.active .step-desc {
      color: #c7d2fe;
    }

    /* Result Banner */
    .result-banner {
      display: none;
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      animation: fadeIn 0.3s ease-out;
    }

    .result-banner.success {
      display: block;
      background: var(--success-bg);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }

    .result-banner.error {
      display: block;
      background: var(--error-bg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }

    .result-title {
      font-weight: 700;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-detail {
      font-size: 11px;
      opacity: 0.9;
      line-height: 1.4;
      word-break: break-word;
    }

    .spinner-sm {
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>🧠</span>
      <span>course2brain</span>
    </div>
    <div id="serverStatus" class="badge badge-offline">
      <span class="dot"></span>
      <span id="serverStatusText">Verificando...</span>
    </div>
  </header>

  <div class="card">
    <div class="meta-row">
      <span class="meta-label">Plataforma:</span>
      <span id="platformName" class="meta-val">Detectando...</span>
    </div>
    <div class="meta-row">
      <span class="meta-label">Aula / Página:</span>
      <span id="pageTitle" class="meta-val">Carregando...</span>
    </div>
  </div>

  <button id="btnProcess" class="btn-action" disabled>
    <span id="btnIcon">⚡</span>
    <span id="btnText">Sintetizar & Salvar no Brain</span>
  </button>

  <!-- Visual Stepper Progress Tracker -->
  <div id="progressCard" class="progress-card">
    <div class="progress-bar-bg">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>

    <div class="step-list">
      <!-- Step 1: Extração -->
      <div id="stepExtract" class="step-item pending">
        <div class="step-icon">1</div>
        <div class="step-content">
          <div class="step-title">Extração do Conteúdo</div>
          <div id="stepExtractDesc" class="step-desc">Aguardando início...</div>
        </div>
      </div>

      <!-- Step 2: Síntese IA -->
      <div id="stepSynthesize" class="step-item pending">
        <div class="step-icon">2</div>
        <div class="step-content">
          <div class="step-title">Síntese com Gemini (3.8 Flash)</div>
          <div id="stepSynthesizeDesc" class="step-desc">Aguardando extração...</div>
        </div>
      </div>

      <!-- Step 3: Vault Obsidian -->
      <div id="stepVault" class="step-item pending">
        <div class="step-icon">3</div>
        <div class="step-content">
          <div class="step-title">Gravação no Vault</div>
          <div id="stepVaultDesc" class="step-desc">Aguardando síntese...</div>
        </div>
      </div>

      <!-- Step 4: Auto-Interlink & Grafo -->
      <div id="stepGraph" class="step-item pending">
        <div class="step-icon">4</div>
        <div class="step-content">
          <div class="step-title">Auto-Interlink no Grafo</div>
          <div id="stepGraphDesc" class="step-desc">Aguardando gravação...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Result Banner -->
  <div id="resultBanner" class="result-banner">
    <div id="resultTitle" class="result-title"></div>
    <div id="resultDetail" class="result-detail"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
