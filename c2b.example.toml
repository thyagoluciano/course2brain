# course2brain Configuration File Example
# Copy this file to `c2b.toml` or `~/.config/c2b/config.toml`

[vault]
# Absolute path to your Obsidian vault (use ~ for home directory)
path = "~/Obsidian/SecondBrain"
courses_folder = "10-Cursos"
concepts_folder = "20-Conceitos"

# ═════════════════════════════════════════════════════════════════════════════
# PROVEDORES DE IA (Escolha um ou configure ambos)
# ═════════════════════════════════════════════════════════════════════════════

[openrouter]
# Chave da API OpenRouter (ou deixe vazio para ler da variável OPENROUTER_API_KEY)
# Veja o guia em docs/OPENROUTER_GUIDE.md para criar conta e obter sua chave gratuita.
api_key = ""
# Modelo padrão recomendado: 'google/gemma-4-31b-it:free' ou 'openrouter/free'
model = "google/gemma-4-31b-it:free"
# Limite de requisições por minuto para modelos gratuitos (padrão seguro: 15)
rpm_limit = 15

[gemini]
# Chave da API Google Gemini (ou deixe vazio para ler da variável GEMINI_API_KEY)
api_key = ""
model = "gemini-3.8-flash"

# ═════════════════════════════════════════════════════════════════════════════
# CONFIGURAÇÃO DINÂMICA DE TAREFAS (Opcional)
# ═════════════════════════════════════════════════════════════════════════════
# Se omitido, o sistema usará o provedor configurado acima (ou gemini por padrão).
[ai]
# Provedor global padrão: "openrouter", "gemini", "openai", "grok", "ollama"
default_provider = "openrouter"

[ai.synthesis]
# Provedor e modelo específicos para sintetizar notas de aula
provider = "openrouter"
model = "google/gemma-4-31b-it:free"

[ai.interlink]
# Provedor e modelo específicos para validação semântica de conexões
provider = "openrouter"
model = "qwen/qwen3.8-27b:free"

[interlink]
# Automatically discover and inject semantic links into Obsidian Graph View
enabled = true
similarity_threshold = 0.78
max_links = 5
embedding_model = "all-MiniLM-L6-v2"
# Path to vectors database (defaults to <vault>/_sistema/vectors.db if empty)
db_path = ""
# Folders relative to the vault to index and discover links for.
# Use ["*"] to index the entire vault (excluding exclude_folders).
include_folders = ["10-Cursos", "50-Conteudo", "20-Conceitos"]
# Folders and system files strictly ignored by the indexer
exclude_folders = [".obsidian", "_sistema", ".trash", "90-Templates", ".git"]

[server]
host = "127.0.0.1"
port = 8765
